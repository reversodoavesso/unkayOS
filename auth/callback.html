<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processando Autenticação...</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f2f5; }
        .container { background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #333; }
        p { color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Processando autenticação...</h2>
        <p id="msg">Aguarde, você será redirecionado.</p>
    </div>
    <script>
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const error = params.get('error');
        const errorDescription = params.get('error_description');

        const message = code && state
            ? { type: 'AUTH_CALLBACK', code, state }
            : { type: 'AUTH_ERROR', error: error || 'invalid_callback', errorDescription, state };
        try {
            if (!state || state !== localStorage.getItem('unkayos_oauth_state')) throw new Error('Estado OAuth inválido.');
            if (window.opener) window.opener.postMessage(message, window.location.origin);
            localStorage.setItem('unkayos_oauth_callback', JSON.stringify(message));
            history.replaceState(null, '', window.location.pathname);
            document.getElementById('msg').textContent = 'Retorne à janela principal do unkayOS.';
            window.close();
        } catch (failure) {
            document.getElementById('msg').textContent = failure.message;
        }
    };
    </script>
</body>
</html>
