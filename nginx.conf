server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security & Performance headers for unkayOS 2.0 Wasm, SharedArrayBuffer & OPFS
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Healthcheck endpoint
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"unkayos"}';
    }

    # Wasm MIME type and immutable caching
    location ~* \.wasm$ {
        default_type application/wasm;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Cache static assets
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # No cache for HTML and JSON (dynamic content)
    location ~* \.(html|json)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Serve static files and fallback to index.html for SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
