limit_req_zone $binary_remote_addr zone=orb_reader:10m rate=30r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Keep browser requests on the deployed HTTPS origin.
    # Docker DNS resolves the service only when this endpoint is used.
    resolver 127.0.0.11 valid=30s;
    set $compute_upstream http://compute-service:3005;
    set $identity_upstream http://auth-ui:3000;
    location = /api/identity/me {
        proxy_pass $identity_upstream/api/auth/verify;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/marketplace/ {
        proxy_pass $compute_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/proxy {
        proxy_pass $compute_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/reader {
        limit_req zone=orb_reader burst=8 nodelay;
        limit_req_status 429;
        proxy_pass $compute_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/compute/health {
        proxy_pass $compute_upstream/health;
    }
    location ^~ /api/compute/ {
        proxy_pass $compute_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /ws/terminal {
        proxy_pass $compute_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
    location /ws/browser {
        proxy_pass $compute_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Security & Performance headers for unkayOS 2.0 Wasm, SharedArrayBuffer & OPFS
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Healthcheck endpoint
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"unkayos"}';
    }

    # Wasm MIME type and immutable caching
    location ~* \.wasm$ {
        default_type application/wasm;
        expires -1;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # ES modules such as DOMPurify must never fall back to octet-stream.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Cache static assets
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # No cache for HTML and JSON (dynamic content)
    location ~* \.(html|json)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # Serve static files and fallback to index.html for SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
