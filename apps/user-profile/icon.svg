<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="userBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="userCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#userBg)" stroke="#2d2d2d" stroke-width="1.5"/>

  <!-- Outer Ring Accent -->
  <circle cx="32" cy="32" r="24" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- User Avatar Silhouette -->
  <!-- Head -->
  <circle cx="32" cy="24" r="9" fill="url(#userCyan)" filter="url(#cyanGlow)"/>

  <!-- Body / Shoulders -->
  <path d="M18 47c0-7.732 6.268-14 14-14s14 6.268 14 14" stroke="url(#userCyan)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- RDA Cybersigil Badge Dot -->
  <circle cx="43" cy="20" r="3.5" fill="#10b981"/>
  <circle cx="43" cy="20" r="1.5" fill="#ffffff"/>
</svg>
