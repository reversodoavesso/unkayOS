<div class="cine-app">
  <header class="cine-header">
    <div class="cine-brand">
      <span class="cine-icon">🎬</span>
      <div>
        <h1>Cine Hub & Workstation</h1>
        <span class="cine-subtitle">Catálogo de Cinema, Análises Críticas & Curadorias Comunitárias</span>
      </div>
    </div>
    <div class="cine-nav">
      <button class="nav-tab active" data-view="catalog">Catálogo & Filmes</button>
      <button class="nav-tab" data-view="editor">Redigir Análise</button>
      <button class="nav-tab" data-view="social">Comunidade RDA</button>
    </div>
  </header>

  <div class="cine-body">
    <!-- View 1: Catalog -->
    <section class="cine-view" id="viewCatalog">
      <div class="catalog-filters">
        <input type="text" id="cineSearchInput" placeholder="Buscar filmes, diretores, curadorias..." />
        <div class="genre-chips">
          <span class="chip active" data-genre="all">Todos</span>
          <span class="chip" data-genre="Sci-Fi">Sci-Fi</span>
          <span class="chip" data-genre="Cyberpunk">Cyberpunk</span>
          <span class="chip" data-genre="Drama">Drama</span>
          <span class="chip" data-genre="Terror">Terror</span>
        </div>
      </div>
      <div class="movie-grid" id="movieGrid">
        <!-- Injected dynamically -->
      </div>
    </section>

    <!-- View 2: Review & Curation Editor -->
    <section class="cine-view" id="viewEditor" style="display: none;">
      <div class="editor-container">
        <div class="editor-sidebar">
          <h3>Filme Selecionado</h3>
          <div class="selected-movie-info" id="selectedMovieInfo">
            <p style="color: #94a3b8; font-size: 13px;">Selecione um filme no catálogo para redigir uma crítica.</p>
          </div>
          <div class="rating-input">
            <label>Sua Avaliação:</label>
            <div class="stars" id="starRating">
              <span data-star="1">★</span>
              <span data-star="2">★</span>
              <span data-star="3">★</span>
              <span data-star="4">★</span>
              <span data-star="5">★</span>
            </div>
          </div>
        </div>
        <div class="editor-main">
          <input type="text" id="reviewTitleInput" placeholder="Título da Análise / Ensaio Crítico..." />
          <textarea id="reviewContentInput" placeholder="Escreva suas impressões, análise de direção, fotografia e trilha sonora em Markdown..."></textarea>
          <div class="editor-actions">
            <span class="status-msg" id="editorStatusMsg"></span>
            <button class="save-btn" id="saveDraftVfsBtn">💾 Salvar Rascunho no VFS</button>
            <button class="publish-btn" id="publishReviewBtn">🚀 Publicar no Cine Social</button>
          </div>
        </div>
      </div>
    </section>

    <!-- View 3: Social & Community -->
    <section class="cine-view" id="viewSocial" style="display: none;">
      <div class="social-feed" id="socialFeed">
        <!-- Community reviews and watchlogs -->
      </div>
    </section>
  </div>
</div>
