<div class="store-app">
  <header class="store-header">
    <div class="store-title-bar">
      <div class="store-brand">
        <span class="store-logo">🛍️</span>
        <h1>unkayOS Marketplace</h1>
      </div>
      <div class="store-tier-info">
        <span class="user-tier-pill" id="userTierPill">Perfil: Guest</span>
      </div>
    </div>
    <div class="store-controls">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="storeSearchInput" placeholder="Buscar aplicativos, ferramentas, DSP, IA..." />
      </div>
      <label class="compatibility-toggle">
        <input type="checkbox" id="compatFilterCheckbox" />
        <span>Apenas compatíveis com meu perfil</span>
      </label>
    </div>
    <nav class="category-tabs" id="categoryTabs">
      <button class="tab-btn active" data-category="all">Todos</button>
      <button class="tab-btn" data-category="audio">🎵 Áudio & Euterpe</button>
      <button class="tab-btn" data-category="media">🎬 Cinema & Cine</button>
      <button class="tab-btn" data-category="ai">✨ IA & OpenUI</button>
      <button class="tab-btn" data-category="productivity">📋 Produtividade</button>
      <button class="tab-btn" data-category="utilities">⚙️ Utilitários & Shell</button>
    </nav>
  </header>

  <main class="store-content">
    <div class="store-banner">
      <div class="banner-text">
        <h2>Ecossistema Aberto e Curado da Ordem RDA</h2>
        <p>Aplicativos verificados com execução isolada em WebAssembly, Web Audio DSP, OpenUI e containers sob demanda.</p>
      </div>
    </div>

    <div class="apps-grid" id="appsGrid">
      <!-- App cards dynamically injected here -->
      <div class="loading-state">Carregando catálogo de aplicativos...</div>
    </div>
  </main>

  <!-- App Detail Modal -->
  <div class="app-modal" id="appDetailModal" style="display: none;">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-card">
      <button class="modal-close-btn" id="modalCloseBtn">✕</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
</div>
