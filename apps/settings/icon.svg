<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="settingsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="settingsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="gearGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#settingsBg)" stroke="#2d2d2d" stroke-width="1.5"/>

  <!-- Outer Orbit Ring -->
  <circle cx="32" cy="32" r="23" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- System Settings Gear Icon -->
  <g transform="translate(16, 16)" filter="url(#gearGlow)">
    <path d="M14.7 1.3a2 2 0 0 0-2.4 0l-1 .7a2 2 0 0 1-2.2 0l-1-.7a2 2 0 0 0-2.4 0l-1.5 1.5a2 2 0 0 0 0 2.4l.7 1a2 2 0 0 1 0 2.2l-.7 1a2 2 0 0 0 0 2.4l1.5 1.5a2 2 0 0 0 2.4 0l1-.7a2 2 0 0 1 2.2 0l1 .7a2 2 0 0 0 2.4 0l1.5-1.5a2 2 0 0 0 0-2.4l-.7-1a2 2 0 0 1 0-2.2l.7-1a2 2 0 0 0 0-2.4L14.7 1.3z" 
          transform="scale(2)"
          fill="url(#settingsCyan)" 
          stroke="#0891b2" 
          stroke-width="0.5"/>
    <circle cx="16" cy="16" r="6" fill="#141414" stroke="url(#settingsCyan)" stroke-width="2"/>
    <circle cx="16" cy="16" r="2.5" fill="#22d3ee"/>
  </g>
</svg>
