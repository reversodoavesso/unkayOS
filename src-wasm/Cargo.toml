[package]
name = "unkay-kernel"
version = "2.0.0"
authors = ["RDA Ecosystem <dev@reversodoavesso.com>"]
edition = "2021"
description = "unkayOS 2.0 WebAssembly Microkernel & VFS"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.77", features = ["console"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.50"

[profile.release]
opt-level = "s"
lto = true
